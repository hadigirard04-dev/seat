<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>seat · 开工屏 Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <div class="logo" aria-hidden="true">S</div>
          <div class="brand-text">
            <h1>seat</h1>
            <p class="tagline">开工屏 · 打开就知道接着做什么</p>
          </div>
        </div>
        <div class="workspace-badge" title="示例工作区路径">
          <span class="dot"></span>
          <code>~/lab</code>
        </div>
      </header>

      <main class="grid">
        <section class="card project-card" aria-labelledby="project-title">
          <div class="card-head">
            <p class="eyebrow">当前项目</p>
            <span class="stage stage-in-progress" id="project-stage">进行中</span>
          </div>
          <h2 id="project-title">—</h2>
          <p class="goal" id="project-goal">—</p>
          <p class="meta">最后更新：<strong id="project-updated">—</strong></p>
        </section>

        <section class="card next-card" aria-labelledby="next-title">
          <div class="card-head">
            <p class="eyebrow accent">下一步</p>
            <span class="meta-inline">只做这一件</span>
          </div>
          <h2 id="next-title" class="next-action">—</h2>
          <p class="risk" id="project-risk" hidden></p>
          <button type="button" class="btn primary" id="btn-copy-continue">
            复制续做指令
          </button>
        </section>

        <section class="card dod-card" aria-labelledby="dod-title">
          <div class="card-head">
            <p class="eyebrow">Definition of Done</p>
            <p class="dod-count" id="dod-count">0 / 0</p>
          </div>
          <div class="progress" aria-hidden="true">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <ul class="dod-list" id="dod-list"></ul>
        </section>

        <section class="card prompt-card" aria-labelledby="prompt-title">
          <div class="card-head">
            <p class="eyebrow">Agent 指令坞</p>
            <p class="meta-inline">一键复制到剪贴板</p>
          </div>
          <h3 id="prompt-title" class="sr-only">可复制的 Agent 指令</h3>
          <div class="prompt-grid" id="prompt-grid"></div>
        </section>
      </main>

      <footer class="foot">
        <p>Demo · 数据为示例 · 不写回真实 STATUS · seat</p>
      </footer>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
